<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 Homebrew Repository</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0d1117;
    color:white;
}

header{
    background:linear-gradient(90deg,#005eff,#00b7ff);
    padding:60px 20px;
    text-align:center;
}

header h1{
    font-size:48px;
}

header p{
    margin-top:15px;
    font-size:20px;
    opacity:.9;
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:40px;
}

.card{
    background:#161b22;
    padding:25px;
    border-radius:15px;
    transition:.25s;
}

.card:hover{
    transform:translateY(-6px);
}

.card h2{
    color:#4da3ff;
    margin-bottom:10px;
}

.button{
    display:inline-block;
    margin-top:20px;
    background:#0078ff;
    color:white;
    text-decoration:none;
    padding:12px 22px;
    border-radius:8px;
}

.button:hover{
    background:#2894ff;
}

footer{
    text-align:center;
    margin:60px 0 20px;
    color:#888;
}
</style>

</head>
<body>

<header>

<h1>PS4 Homebrew Repository</h1>

<p>Community repository for PS4 homebrew.</p>

<a class="button" href="repo.json">Repository JSON</a>

</header>

<div class="container">

<div class="cards">

<div class="card">
<h2>Homebrew</h2>
<p>Applications, utilities and open-source homebrew packages.</p>
</div>

<div class="card">
<h2>Repository</h2>
<p>Fast GitHub-hosted repository with easy updates.</p>
</div>

<div class="card">
<h2>Status</h2>
<p>🚧 Repository currently under development.</p>
</div>

</div>

</div>

<footer>

© 2026 PS4 Homebrew Repository

</footer>

</body>
</html>
